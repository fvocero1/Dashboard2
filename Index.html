<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FY27 IT Controls Tracker</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#172033;--muted:#6f7b90;--line:#e4e8ef;--blue:#2563eb;--green:#15966d;--red:#d04444;--orange:#d9822b;--purple:#7657c5;--shadow:0 8px 24px #1d31550d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1600px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:25px}.brand p{margin:6px 0 0;color:var(--muted)}.topmeta{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:12px}.topmeta b{display:block;color:var(--ink);font-size:13px}.primary{background:var(--blue);color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:600}.secondary{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{border:0;background:transparent;padding:12px 18px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.filters,.card,.chart-card,.panel,.empty{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.filters{padding:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:5px;min-width:130px}.field label{font-size:11px;color:var(--muted);font-weight:600}.field input,.field select{border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff;min-height:36px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{padding:16px}.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-size:25px;font-weight:700;margin-top:7px}.kpi.alert .value{color:var(--red)}.section-title{font-size:16px;margin:24px 0 10px}.charts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.chart-card{padding:16px;min-height:285px}.chart-card h3{font-size:14px;margin:0 0 12px}.chart-wrap{height:225px;position:relative}.panels{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.panel{padding:16px}.panel h3{margin:0 0 10px;font-size:14px}.metricline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.metricline:last-child{border:0}.table-card{margin-top:14px;padding:16px}.tablehead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.tablehead h3{margin:0}.table-scroll{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:#f8fafc;color:var(--muted);font-size:11px;text-transform:uppercase;z-index:1}tbody tr:nth-child(even){background:#fbfcfe}tbody tr:hover{background:#eef5ff}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700;background:#edf0f4;color:#5b6472}.b-complete{background:#dff6ec;color:#087b55}.b-progress{background:#e3edff;color:#1d56c4}.b-pending{background:#fff0d8;color:#a85e0b}.b-review{background:#eee7ff;color:#6642aa}.b-past{background:#ffe2e2;color:#a52626}.b-late{background:#ffe2e2;color:#a52626}.empty{max-width:700px;margin:12vh auto;padding:46px;text-align:center}.empty h2{margin:12px 0 8px}.empty p{color:var(--muted)}.drop{border:2px dashed #bfc9da;border-radius:12px;padding:26px;margin:24px 0;color:var(--muted)}.insights{display:grid;gap:9px}.insight{padding:10px 12px;background:#f7f9fc;border-radius:8px}.quality{color:var(--green);font-weight:600}.muted{color:var(--muted)}.pagination{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}.hidden{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.charts,.panels{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.shell{padding:14px}.grid{grid-template-columns:1fr}.topmeta{flex-wrap:wrap}.tabs{overflow:auto}.tab{white-space:nowrap}}@media print{.filters,.tabs,.primary,.secondary{display:none!important}.shell{max-width:none}.card,.chart-card,.panel,.table-card{box-shadow:none}}

</style>
</head>
<body>
<div id="app"></div>
<input id="fileInput" type="file" accept=".xlsx,.xls" hidden>
<input id="folderInput" type="file" webkitdirectory directory multiple hidden>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function() {
const REQUIRED=['ITGC','ITAC','Connect Export ITGCs','Connect Export ITACs'];const SHAREPOINT_URL='https://pwc.sharepoint.com/:x:/r/sites/US-ASR-SnowflakeTeam-SnowflakeDAT/_layouts/15/Doc.aspx?sourcedoc=%7BC5D99D99-B9E9-4F59-9424-A730B2054F94%7D&file=Snowflake%20FY27%20Tracker.xlsx&action=default&mobileredirect=true&DefaultItemOpen=1';const state={raw:{itgc:[],itac:[],connect:[]},tab:'overview',filters:{type:'All',status:'All',preparer:'All',reviewer:'All',reliance:'All',risk:'All',past:'All',search:''},charts:{},page:{itgc:1,itac:1,connect:1},file:''};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function norm(v){return String(v??'').replace(/[\n\t]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase()}function clean(v){let s=String(v??'').trim();return /^(n\/a|na|n\/a - non-key|-|)$/.test(s.toLowerCase())?'':s}function canonicalName(v){let original=clean(v);if(!original)return'Non-key';let key=original.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,;:_-]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();if(/^(unassigned|unassigned name|non-key|non key)$/.test(key))return'Non-key';const aliases={iosef:['iosef','josef','joseph'],fernando:['fernando','fernando w vocero','fernando vocero'],dylan:['dylan','dillon','dylan a','dylan arthur'],lex:['alexis','lex','alexis lex'],emily:['emily','emilie','emily a','emily anne']};for(const [canonical,names] of Object.entries(aliases)){if(names.some(n=>key===n||key.startsWith(n+' ')))return canonical[0].toUpperCase()+canonical.slice(1)}let parts=key.split(' ');if(parts.length===2&&parts[1].length===1)return parts[0][0].toUpperCase()+parts[0].slice(1);return original.replace(/\s+/g,' ').trim()}
function date(v){if(v instanceof Date&&!isNaN(v))return new Date(v);if(typeof v==='number'&&v>20000)return new Date(Date.UTC(1899,11,30)+v*86400000);if(!v)return null;let d=new Date(v);return isNaN(d)?null:d}function day(d){let x=new Date(d);x.setHours(0,0,0,0);return x}function fmt(v){let d=date(v);return d?d.toLocaleDateString(undefined,{month:'short',day:'2-digit',year:'numeric'}):'—'}function complete(s){return /complete|final signed off/i.test(s||'')}function category(s){let x=norm(s);if(!x)return'N/A';if(complete(x))return'Completed';if(/review|sign.?off/.test(x))return'Review';if(/pending|not started|ready to start|on hold/.test(x))return'Pending';if(/follow-up|follow up|client/.test(x))return'Follow-up';if(/progress|testing|draft/.test(x))return'In Progress';return'Other'}function overdue(d,s){let x=date(d);return !!x&&!complete(s)&&day(x)<day(new Date())}function daysOver(d){let x=date(d);return x&&day(x)<day(new Date())?Math.floor((day(new Date())-day(x))/86400000):0}function late(l,d){let a=date(l),b=date(d);return !!a&&!!b&&a>b}function daysLate(l,d){let a=date(l),b=date(d);return a&&b&&a>b?Math.floor((day(a)-day(b))/86400000):0}function badge(s,cl=''){let c=category(s);return `<span class="badge ${cl||({'Completed':'b-complete','In Progress':'b-progress','Pending':'b-pending','Review':'b-review'}[c]||'')} ">${esc(s||'N/A')}</span>`}
function header(rows,n){let m={};(rows[n]||[]).forEach((v,i)=>{let k=norm(v);if(k)m[k]=i});return m}function pick(map,n,fallback){return map[norm(n)]??fallback}function rows(ws){return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})}
function parseControl(ws,type){let rs=rows(ws), h=header(rs,type==='ITGC'?18:15), fb=type==='ITGC'?{id:1,risk:2,rel:3,work:null,status:23,preparer:40,di:null,oe:null,r1:41,r2:42,r3:43,sprint:25,connectStatus:21,due:22,aura:27,queue:24}:{id:1,risk:2,rel:3,work:7,status:20,preparer:38,di:37,oe:38,r1:39,r2:40,r3:41,sprint:22,connectStatus:18,due:19,aura:24,queue:21};let ix=n=>pick(h,n,fb[n]);return rs.slice(type==='ITGC'?19:16).map(r=>{let id=clean(r[ix('Control ID')]);if(!id)return null;let st=clean(r[ix('OE Status Interim')]),d=r[ix('Connect Request Due Date Interim')], prep=canonicalName(clean(r[ix(type==='ITAC'?'OE Preparer':'Preparer')])||clean(r[ix('D&I Preparer')]));return {type,id,risk:clean(r[ix('FY27 Risk Rating')]),rel:clean(r[ix('FY27 Reliance')]),work:clean(r[ix('Workstream')]),status:st,preparer:prep,di:canonicalName(r[ix('D&I Preparer')]),oe:canonicalName(r[ix('OE Preparer')]),r1:canonicalName(r[ix('1st Reviewer')]),r2:canonicalName(r[ix('2nd Reviewer')]),r3:canonicalName(r[ix('3rd Reviewer')]),sprint:clean(r[ix(type==='ITGC'?'Sprint (OE Interim)':'Sprint')]),connectStatus:clean(r[ix('Connect Status Interim')]),due:date(d),aura:clean(r[ix(type==='ITGC'?'Aura Status':'Aura Status Interim')]),queue:clean(r[ix(type==='ITGC'?'OE Queue Interim':'OE Queue Interim')]),past:overdue(d,st),raw:r}}).filter(Boolean)}
function isNonKeyControl(x){return /non[- ]?key/i.test([x.id,x.risk,x.rel,x.work,x.status].filter(Boolean).join(' '))}
function parseConnect(ws,type,controls){let rs=rows(ws),h=header(rs,6), ix=n=>pick(h,n,{engagement:0,id:1,request:4,desc:5,status:6,priority:7,due:8,created:9,release:10,original:11,latest:12,returned:13,accepted:14}[n]);return rs.slice(7).map(r=>{let id=clean(r[ix('Request ID')]),req=clean(r[ix('Request')]);if(!id&&!req)return null;let d=date(r[ix('Due Date (UTC)')]),o=date(r[ix('Original Submission Date (UTC)')]), lc=late(o,d), ov=!!d&&day(d)<day(new Date())&&!o;let cid=(req.match(/\b[A-Z]{2,5}-[A-Z0-9]+(?:-[A-Z0-9]+)?\b/i)||[])[0]||'';return {type,id,request:req,description:clean(r[ix('Description')]),status:clean(r[ix('Status')]),priority:clean(r[ix('Priority')]),due:d,original:o,latest:date(r[ix('Latest Submission Date (UTC)')]),returned:date(r[ix('Latest Return Date (UTC)')]),accepted:date(r[ix('Latest Accepted Date (UTC)')]),controlId:cid,late:lc,overdue:ov,daysLate:daysLate(o,d),daysOverdue:ov?Math.floor((day(new Date())-day(d))/86400000):0}}).filter(Boolean)}
function opts(arr,key){return [...new Set(arr.map(x=>x[key]).filter(Boolean))].sort().map(v=>`<option>${esc(v)}</option>`).join('')}
function filtered(arr){return arr.filter(x=>(state.filters.type==='All'||x.type===state.filters.type)&&(state.filters.status==='All'||x.status===state.filters.status)&&(state.filters.preparer==='All'||x.preparer===state.filters.preparer)&&(state.filters.reviewer==='All'||x.r1===state.filters.reviewer)&&(state.filters.reliance==='All'||x.rel===state.filters.reliance)&&(state.filters.risk==='All'||x.risk===state.filters.risk)&&(state.filters.past==='All'||(state.filters.past==='Past Due'&&x.past)||(state.filters.past==='Not Past Due'&&!x.past))&&(!state.filters.search||JSON.stringify(x).toLowerCase().includes(state.filters.search.toLowerCase())))}
function k(label,val,cl=''){return `<div class="card kpi ${cl}"><div class="label">${label}</div><div class="value">${val}</div></div>`}function chart(id,type,labels,datasets){if(state.charts[id])state.charts[id].destroy();let ctx=document.getElementById(id);if(!ctx)return;state.charts[id]=new Chart(ctx,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:type==='doughnut'?{}:{y:{stacked:type==='bar'},x:{stacked:type==='bar',beginAtZero:true}}}})}
function controlKPIs(a){let done=a.filter(x=>complete(x.status)).length, past=a.filter(x=>x.past).length, open=a.length-done;return {done,past,open,pct:a.length?Math.round(done/a.length*100):0}}
function filtersUI(a){return `<div class="filters"><div class="field"><label>Search</label><input id="f-search" value="${esc(state.filters.search)}" placeholder="Control ID or text"></div><div class="field"><label>Status</label><select id="f-status"><option>All</option>${opts(a,'status')}</select></div><div class="field"><label>Preparer</label><select id="f-preparer"><option>All</option>${opts(a,'preparer')}</select></div><div class="field"><label>1st Reviewer</label><select id="f-reviewer"><option>All</option>${opts(a,'r1')}</select></div><div class="field"><label>Reliance</label><select id="f-reliance"><option>All</option>${opts(a,'rel')}</select></div><div class="field"><label>Risk Rating</label><select id="f-risk"><option>All</option>${opts(a,'risk')}</select></div><div class="field"><label>Past Due</label><select id="f-past"><option>All</option><option>Past Due</option><option>Not Past Due</option></select></div><button class="secondary" id="clear">Clear Filters</button></div>`}
function controlTable(a,type){let page=state.page[type.toLowerCase()]||1, size=15, start=(page-1)*size, p=a.slice(start,start+size);return `<div class="table-card"><div class="tablehead"><h3>${type} Controls <span class="muted">${a.length} shown</span></h3><div><button class="secondary" id="csv-${type}">Export Filtered CSV</button></div></div><div class="table-scroll"><table><thead><tr>${['Control ID','Risk Rating','Reliance','Workstream','Status','Preparer','1st Reviewer','Sprint','Connect Status','Due Date','Aura Status','Past Due','Days Overdue'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${p.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.risk)}</td><td>${esc(x.rel)}</td><td>${esc(x.work)}</td><td>${badge(x.status)}</td><td>${esc(x.preparer||'—')}</td><td>${esc(x.r1||'—')}</td><td>${esc(x.sprint||'—')}</td><td>${esc(x.connectStatus||'—')}</td><td>${fmt(x.due)}</td><td>${esc(x.aura||'—')}</td><td>${x.past?'<span class="badge b-past">PAST DUE</span>':'—'}</td><td>${x.past?daysOver(x.due):0}</td></tr>`).join('')}</tbody></table></div><div class="pagination"><button class="secondary" data-prev="${type}">Prev</button><span>Page ${page} of ${Math.max(1,Math.ceil(a.length/size))}</span><button class="secondary" data-next="${type}">Next</button></div></div>`}
function renderControl(type){let all=state.raw[type.toLowerCase()], a=filtered(all), z=controlKPIs(a);return `<h2 class="section-title">${type} Controls</h2>${filtersUI(all)}<div class="grid">${k('Total '+type+'s',a.length)}${k('Completed',z.done)}${k('Open',z.open)}${k('Past Due',z.past,'alert')}${k('Completion %',z.pct+'%')}${k('Due This Week',a.filter(x=>x.due&&daysOver(x.due)===0&&day(x.due)>=day(new Date())).length)}${k('Due Next 7 Days',a.filter(x=>x.due&&day(x.due)>=day(new Date())&&day(x.due)<=new Date(day(new Date()).getTime()+7*86400000)).length)}</div><div class="charts"><div class="chart-card"><h3>${type} Status</h3><div class="chart-wrap"><canvas id="statusChart"></canvas></div></div><div class="chart-card"><h3>Status by Preparer</h3><div class="chart-wrap"><canvas id="prepChart"></canvas></div></div></div>${controlTable(a,type)}`}
function renderOverview(){let a=filtered([...state.raw.itgc,...state.raw.itac]), z=controlKPIs(a), c=state.raw.connect, done=z.done, conLate=c.filter(x=>x.late).length, conOver=c.filter(x=>x.overdue).length;return `<h2 class="section-title">Executive Overview</h2>${filtersUI(a)}<div class="grid">${k('Total Controls',a.length)}${k('ITGCs',a.filter(x=>x.type==='ITGC').length)}${k('ITACs',a.filter(x=>x.type==='ITAC').length)}${k('Completed',done)}${k('In Progress',z.open-z.past)}${k('Pending / Not Started',a.filter(x=>category(x.status)==='Pending').length)}${k('Past Due',z.past,'alert')}${k('Completion %',z.pct+'%')}</div><div class="charts"><div class="chart-card"><h3>Overall Progress</h3><div class="chart-wrap"><canvas id="overallChart"></canvas></div></div><div class="chart-card"><h3>ITGC vs ITAC Progress</h3><div class="chart-wrap"><canvas id="compareChart"></canvas></div></div><div class="chart-card"><h3>Past Due by Control Type</h3><div class="chart-wrap"><canvas id="pastChart"></canvas></div></div><div class="chart-card"><h3>Controls by Preparer</h3><div class="chart-wrap"><canvas id="preparerChart"></canvas></div></div></div><h2 class="section-title">Past Due Controls</h2><div class="panels">${['ITGC','ITAC'].map(t=>{let q=a.filter(x=>x.type===t&&x.past),avg=q.length?Math.round(q.reduce((s,x)=>s+daysOver(x.due),0)/q.length):0;return `<div class="panel"><h3>${t} Past Due</h3><div class="metricline"><span>Total overdue</span><b>${q.length}</b></div><div class="metricline"><span>Average days overdue</span><b>${avg}</b></div><div class="metricline"><span>Most overdue</span><b>${esc(q.sort((m,n)=>daysOver(n.due)-daysOver(m.due))[0]?.id||'—')}</b></div></div>`}).join('')}</div><h2 class="section-title">Connect Requests Status</h2><div class="grid">${k('Total Connect Requests',c.length)}${k('ITGC Requests',c.filter(x=>x.type==='ITGC').length)}${k('ITAC Requests',c.filter(x=>x.type==='ITAC').length)}${k('Late Submissions',conLate,'alert')}${k('Currently Past Due',conOver,'alert')}${k('Returned',c.filter(x=>/returned/i.test(x.status)).length)}</div><div class="charts"><div class="chart-card"><h3>Connect Status Distribution</h3><div class="chart-wrap"><canvas id="connectChart"></canvas></div></div><div class="chart-card"><h3>Key Insights</h3><div class="insights"><div class="insight">${conLate} Connect Requests were submitted after their due date.</div><div class="insight">${conOver} Connect Requests are currently overdue and not submitted.</div><div class="insight">${z.past} controls are currently past due.</div><div class="insight">${a.length?Math.round(done/a.length*100):0}% of filtered controls are completed.</div></div></div></div>`}
function renderConnect(){let c=state.raw.connect||[], statuses=[...new Set(c.map(x=>x.status||'N/A'))], rows=c.slice().sort((a,b)=>(b.overdue-a.overdue)||(b.late-a.late)||((b.daysOverdue||b.daysLate)-(a.daysOverdue||a.daysLate)));return `<h2 class="section-title">Connect Requests</h2><div class="grid">${k('Total Requests',c.length)}${k('Accepted',c.filter(x=>/accepted/i.test(x.status)).length)}${k('Draft',c.filter(x=>/draft/i.test(x.status)).length)}${k('Submitted',c.filter(x=>/submitted/i.test(x.status)).length)}${k('Returned',c.filter(x=>/returned/i.test(x.status)).length)}${k('Late Submissions',c.filter(x=>x.late).length,'alert')}${k('Currently Overdue',c.filter(x=>x.overdue).length,'alert')}</div><div class="charts"><div class="chart-card"><h3>Requests by Status</h3><div class="chart-wrap"><canvas id="connectDetailChart"></canvas></div></div><div class="chart-card"><h3>Status Summary</h3>${statuses.map(s=>`<div class="metricline"><span>${badge(s)}</span><b>${c.filter(x=>(x.status||'N/A')===s).length}</b></div>`).join('')}</div></div><div class="table-card"><div class="tablehead"><h3>Connect Request Details <span class="muted">${c.length} requests</span></h3></div><div class="table-scroll"><table><thead><tr><th>Type</th><th>Request ID</th><th>Control ID</th><th>Request</th><th>Status</th><th>Priority</th><th>Due Date</th><th>Original Submission</th><th>Timing</th><th>Days Late</th><th>Days Overdue</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.type)}</td><td><b>${esc(x.id)}</b></td><td>${esc(x.controlId||'—')}</td><td>${esc(x.request||'—')}</td><td>${badge(x.status)}</td><td>${esc(x.priority||'—')}</td><td>${fmt(x.due)}</td><td>${fmt(x.original)}</td><td>${x.overdue?'<span class="badge b-past">OVERDUE</span>':x.late?'<span class="badge b-late">LATE SUBMISSION</span>':x.original?'<span class="badge b-complete">ON TIME</span>':'<span class="badge">NOT SUBMITTED</span>'}</td><td>${x.daysLate||0}</td><td>${x.daysOverdue||0}</td></tr>`).join('')}</tbody></table></div></div>`}function render(){let body=state.tab==='overview'?renderOverview():state.tab==='Connect'?renderConnect():renderControl(state.tab);$('#app').innerHTML=`<div class="shell"><div class="top"><div class="brand"><h1>FY27 IT Controls Tracker</h1><p>ITGC, ITAC & Connect Progress Dashboard</p></div><div class="topmeta"><span>Loaded File<b>${esc(state.file)}</b></span><span>Last Refresh<b>${new Date().toLocaleString()}</b></span><button class="primary" id="load">Load New Tracker</button></div></div><div class="tabs"><button class="tab ${state.tab==='overview'?'active':''}" data-tab="overview">Overview</button><button class="tab ${state.tab==='ITGC'?'active':''}" data-tab="ITGC">ITGCs</button><button class="tab ${state.tab==='ITAC'?'active':''}" data-tab="ITAC">ITACs</button><button class="tab ${state.tab==='Connect'?'active':''}" data-tab="Connect">Connect Requests</button></div>${body}<footer class="muted">FY27 IT Controls Dashboard · Data processed locally in your browser.</footer></div>`;bind();draw()}
function draw(){if(state.tab==='Connect'){let c=state.raw.connect||[],ss=[...new Set(c.map(x=>x.status||'N/A'))];chart('connectDetailChart','doughnut',ss,[{data:ss.map(s=>c.filter(x=>(x.status||'N/A')===s).length),backgroundColor:['#15966d','#2563eb','#d9822b','#7657c5','#94a3b8','#d04444']}]);return}let all=[...state.raw.itgc,...state.raw.itac], statuses=[...new Set(all.map(x=>x.status||'N/A'))];if(state.tab==='overview'){chart('overallChart','doughnut',statuses,[{data:statuses.map(s=>all.filter(x=>(x.status||'N/A')===s).length),backgroundColor:['#15966d','#2563eb','#d9822b','#7657c5','#94a3b8','#d04444']}]);chart('compareChart','bar',['ITGC','ITAC'],[{label:'Completed',data:['ITGC','ITAC'].map(t=>all.filter(x=>x.type===t&&complete(x.status)).length),backgroundColor:'#15966d'},{label:'Open',data:['ITGC','ITAC'].map(t=>all.filter(x=>x.type===t&&!complete(x.status)&&!x.past).length),backgroundColor:'#2563eb'},{label:'Past Due',data:['ITGC','ITAC'].map(t=>all.filter(x=>x.type===t&&x.past).length),backgroundColor:'#d04444'}]);chart('pastChart','doughnut',['ITGC','ITAC'],[{data:['ITGC','ITAC'].map(t=>all.filter(x=>x.type===t&&x.past).length),backgroundColor:['#d04444','#7657c5']}]);let ps=[...new Set(all.map(x=>x.preparer||'Non-key'))],prepStatuses=[...new Set(all.map(x=>x.status||'N/A'))],statusColors={'Completed':'#70ad47','In Progress':'#f4b183','Pending Evidence':'#a6a6a6','Pending':'#a6a6a6','Ready to Start':'#9dc3e6','Review':'#7030a0','Follow-up':'#ffd966','N/A':'#d9e1f2','Other':'#d9e1f2'};chart('preparerChart','bar',ps,prepStatuses.map(s=>({label:s,data:ps.map(p=>all.filter(x=>(x.preparer||'Non-key')===p&&(x.status||'N/A')===s).length),backgroundColor:statusColors[category(s)]||'#64748b'})));chart('connectChart','doughnut',[...new Set(state.raw.connect.map(x=>x.status||'N/A'))].map(s=>s||'N/A'),[{data:[...new Set(state.raw.connect.map(x=>x.status||'N/A'))].map(s=>state.raw.connect.filter(x=>(x.status||'N/A')===s).length),backgroundColor:['#2563eb','#15966d','#d9822b','#7657c5','#94a3b8']}])}else{let a=filtered(state.raw[state.tab.toLowerCase()]), ss=[...new Set(a.map(x=>x.status||'N/A'))],ps=[...new Set(a.map(x=>x.preparer||'Unassigned'))];chart('statusChart','doughnut',ss,[{data:ss.map(s=>a.filter(x=>(x.status||'N/A')===s).length),backgroundColor:['#15966d','#2563eb','#d9822b','#7657c5','#94a3b8','#d04444']}]);chart('prepChart','bar',ps,[{label:'Controls',data:ps.map(p=>a.filter(x=>(x.preparer||'Unassigned')===p).length),backgroundColor:'#2563eb'}])}}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('#load').onclick=()=>$('#fileInput').click();document.querySelectorAll('.filters select').forEach(s=>{let key=s.id.slice(2);s.value=state.filters[key]||'All';s.onchange=()=>{state.filters[key]=s.value;render()}});let q=$('#f-search');if(q)q.oninput=e=>{state.filters.search=e.target.value;render()};let cl=$('#clear');if(cl)cl.onclick=()=>{state.filters={type:'All',status:'All',preparer:'All',reviewer:'All',reliance:'All',risk:'All',past:'All',search:''};render()};document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{let k=b.dataset.prev.toLowerCase();state.page[k]=Math.max(1,(state.page[k]||1)-1);render()});document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{let k=b.dataset.next.toLowerCase();state.page[k]=(state.page[k]||1)+1;render()});document.querySelectorAll('[id^=csv-]').forEach(b=>b.onclick=()=>{let type=b.id.slice(4),a=filtered(state.raw[type.toLowerCase()]);let csv=[Object.keys(a[0]||{}),...a.map(x=>Object.values(x))].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),aEl=document.createElement('a');aEl.href=u;aEl.download=type+'-filtered.csv';aEl.click();URL.revokeObjectURL(u)})}
function showUpload(msg=''){ $('#app').innerHTML=`<div class="empty"><div class="quality">● Local-only processing</div><h2>Load your FY27 Tracker</h2><p>Drag & drop the Excel tracker, select a file, or open it directly from SharePoint.</p><div class="drop" id="drop">Drop .xlsx or .xls here</div><button class="primary" id="folder" onclick="document.getElementById('folderInput').click()">Load from team folder</button><button class="primary" id="sharepoint" style="margin-left:8px">Load from SharePoint</button><button class="secondary" id="pick" style="margin-left:8px">Select Excel File</button><p class="muted" style="font-size:12px;margin-top:18px">SharePoint may request sign-in. If direct browser loading is blocked, use SharePoint's <b>Download</b> option and select the downloaded file.</p>${msg?`<p style="color:var(--red)">${esc(msg)}</p>`:''}</div>`;$('#pick').onclick=()=>$('#fileInput').click();$('#sharepoint').onclick=loadFromSharePoint;let d=$('#drop');d.ondragover=e=>{e.preventDefault();d.style.borderColor='#2563eb'};d.ondrop=e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])}}
async function loadFromSharePoint(){try{const response=await fetch(SHAREPOINT_URL,{credentials:'include'});if(!response.ok)throw Error('SharePoint returned '+response.status);const blob=await response.blob();if(!/sheet|excel|octet-stream/i.test(blob.type))throw Error('The SharePoint link returned a webpage instead of an Excel file.');loadFile(new File([blob],'Snowflake FY27 Tracker.xlsx',{type:blob.type}))}catch(e){window.open(SHAREPOINT_URL,'_blank','noopener');showUpload('No se pudo cargar automáticamente desde SharePoint. Se abrió el tracker en una pestaña nueva; descargalo desde SharePoint y luego seleccioná el archivo descargado.')}}
async function loadFile(file){if(!file)return;try{let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});let miss=REQUIRED.filter(s=>!wb.SheetNames.includes(s));if(miss.length)throw Error('Required sheet(s) missing: '+miss.join(', '));let itgc=parseControl(wb.Sheets.ITGC,'ITGC').filter(x=>!isNonKeyControl(x)),itac=parseControl(wb.Sheets.ITAC,'ITAC').filter(x=>!isNonKeyControl(x));state.raw={itgc,itac,connect:[...parseConnect(wb.Sheets['Connect Export ITGCs'],'ITGC',itgc),...parseConnect(wb.Sheets['Connect Export ITACs'],'ITAC',itac)]};state.file=file.name;state.tab='overview';render()}catch(e){showUpload(e.message)}}$('#fileInput').onchange=e=>loadFile(e.target.files[0]);$('#folderInput').onchange=e=>{let f=[...e.target.files].find(x=>/\.xlsx?$/i.test(x.name));if(f)loadFile(f);else showUpload('No se encontró un archivo Excel en la carpeta seleccionada.');};showUpload();

});
</script>
